    <script>
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return customFetch || originalFetch;
            },
            set: function(fn) {
              customFetch = fn;
            }
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto && Object.getOwnPropertyDescriptor(proto, 'fetch')) {
              var orig = proto.fetch;
              var cur = orig;
              Object.defineProperty(proto, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() { return cur || orig; },
                set: function(fn) { cur = fn; }
              });
            }
          } catch (err) {}
        }
      })();
    </script>
