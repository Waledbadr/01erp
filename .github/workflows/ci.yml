name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Typecheck, Lint & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Linter
        run: npm run lint

      - name: Run Automated Test Suites
        run: npm test

      - name: Run Post-Deploy Smoke Test Suite
        run: npm run test:smoke

      - name: Verify Native Node ESM API Startup
        run: npm run test:api-esm

      - name: Build Application
        run: npm run build
